name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/ examples/

      - name: Run automated test suite
        run: pytest -v

      - name: Run end-to-end demonstration
        run: python examples/run_demo.py

  action-smoke-test:
    name: Composite GitHub Action Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run local Upstream Check Action
        uses: ./
        with:
          config: "upstream-check.yaml"
          source: "air-quality"
          output: "terminal"
        env:
          UPSTREAM_CHECK_NOW: "2026-11-13T12:00:00Z"
